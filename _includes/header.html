<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}">
      <span class="brand-mark" aria-hidden="true">🌿</span>
      <span class="brand-text">
        <span>Ogrody działkowe</span>
        <strong>Montinowiec</strong>
      </span>
    </a>

    <nav class="site-nav" aria-label="Główna nawigacja">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
