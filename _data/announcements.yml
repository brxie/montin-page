- title: "Wybór tymczasowego przedstawiciela działkowców – Krzysztof Szymkowicz"
  date: 2026-07-18
  type: "Aktualność"
  level: "important"
  description: "18 lipca 2026 r. na zebraniu działkowców przeprowadzono tajne głosowanie, w którym wybrano tymczasowego przedstawiciela działkowców. Nowym przedstawicielem został Krzysztof Szymkowicz, uzyskując 15 z 18 głosów. Funkcja ta obejmuje koordynację bieżących spraw ogrodów oraz reprezentowanie działkowców do czasu powołania docelowych władz stowarzyszenia rejestrowego, którego utworzenie planowane jest na jesień."

- title: "Wykonano instalację elektryczną do zasilania pompy głębinowej"
  date: 2026-07-12
  type: "Aktualność"
  level: "info"
  description: "11 lipca 2026 r. wykonano ważny etap prac przy nowej studni awaryjnej — przygotowano nowoczesną instalację elektryczną do zasilania pompy głębinowej. Zakres prac obejmował wykonanie przyłącza, rozprowadzenie kabli oraz montaż skrzynki elektrycznej do automatycznego sterowania pompą. Prace wykonano dzięki wspólnemu zaangażowaniu działkowiczów."
  link: "/galeria/instalacja-elektryczna-studnia/"

- title: "Zebranie działkowców – 18 lipca 2026 r."
  date: 2026-07-10
  type: "Ogłoszenie"
  level: "important"
  description: "Zapraszamy wszystkich właścicieli działek na zebranie, które odbędzie się 18 lipca 2026 r. (sobota) o godz. 12:00 na górnym parkingu. Temat: wybór tymczasowej reprezentacji działkowców po rezygnacji obecnego zarządu. Celem zebrania będzie zgłoszenie kandydatur i wybór tymczasowego przedstawiciela działkowców. Wybrana osoba przejmie bieżące obowiązki po rezygnacji obecnego zarządu. Funkcja ta będzie pełniona do czasu utworzenia formalnego stowarzyszenia. UWAGA: nowe miejsce spotkania – Parking na górze."

