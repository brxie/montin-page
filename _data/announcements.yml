- title: "Spotkanie działkowców – 20 czerwca 2026 r."
  date: 2026-06-14
  type: "Ogłoszenie"
  level: "important"
  description: "Zapraszamy na spotkanie w sobotę 20 czerwca 2026 r. o godz. 12:00. Na spotkaniu omówimy dalsze prace związane z nową studnią u góry ogrodów. Odbędzie się również głosowanie nad wyborem sposobu realizacji tej inwestycji, w tym nad zakresem prac i sposobem finansowania."

- title: "Posiedzenie zarządu – nowa studnia na górze"
  date: 2026-06-13
  type: "Aktualność"
  level: "info"
  description: "W dniu 13 czerwca odbyło się posiedzenie zarządu, na którym omówiono dalsze kroki dotyczące nowo wybudowanej studni na górze. Decyzje w sprawie dalszych działań zostaną podjęte na osobnym spotkaniu ze wszystkimi działkowcami."

- title: "Częściowa naprawa drugiej bramy wjazdowej od ul. Ogrodowej"
  date: 2026-05-24
  type: "Aktualność"
  level: "info"
  description: "Dzięki wspólnej inicjatywie działkowiczów udało się przeprowadzić częściową naprawę drugiej bramy wjazdowej od ul. Ogrodowej. W ramach prac obniżono i zagęszczono teren, co pozwoliło przywrócić swobodne otwieranie bramy. W najbliższym czasie planowane jest dodatkowe wzmocnienie konstrukcji w celu poprawy stabilności skrzydła."

