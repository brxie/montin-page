<!doctype html>
<html lang="{{ site.lang | default: 'pl-PL' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ page.og_image | default: '/assets/ogrody-panorama.jpg' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="pl_PL">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Przejdź do treści</a>
    {% include header.html %}

    <main id="content">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
